name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run E2E for version upgrades or major changes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Verify
        run: bun run --silent ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'verify:full' || 'verify:advance' }}

  platform-check:
    name: Platform check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-24.04
            verify-options: ""
          - name: Windows
            os: windows-2022
            verify-options: "--portable"
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libasound2-dev
          patchelf
          xvfb
          xauth
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Verify TypeScript and Rust
        run: bun run --silent verify:advance ${{ matrix.verify-options }}
      - name: Tool-chain simulator
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --bin toolchain_simulate -- --json

  rust-packages:
    name: Rust tests (${{ matrix.package }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [crates/personal-state-core, crates/larm-session, crates/reasoning-contract, crates/terminal-agent-runtime, services/reasoning-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.package }}
      - run: bun run --silent verify:advance --package "${{ matrix.package }}"

  spec:
    name: Specification check
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run spec:check
      - name: Verify documents were not rewritten
        run: git diff --exit-code -- spec/docs
