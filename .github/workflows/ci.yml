name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run check:local

  platform-check:
    name: Platform check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-24.04
            frontend-test: test:frontend
          - name: Windows
            os: windows-2022
            frontend-test: test:frontend:portable
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libasound2-dev
          patchelf
          xvfb
          xauth
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Frontend static checks
        run: bun run freeze:check && bun run format:check && bun run lint && bun run size:check && bun run build:frontend
      - name: Frontend tests
        run: bun run ${{ matrix.frontend-test }}
      - name: Rust format
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Ubuntu desktop smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run desktop:smoke --report-dir "${{ runner.temp }}/saaa-desktop-smoke"
      - name: Windows desktop smoke
        if: runner.os == 'Windows'
        run: bun run desktop:smoke --report-dir "${{ runner.temp }}/saaa-desktop-smoke"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-smoke-report-${{ matrix.name }}
          path: ${{ runner.temp }}/saaa-desktop-smoke
          retention-days: 7
          if-no-files-found: warn

  rust-packages:
    name: Rust tests (${{ matrix.package }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [crates/personal-state-core, crates/larm-session, crates/reasoning-contract, services/reasoning-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.package }}
      - run: cargo test --locked --manifest-path "${{ matrix.package }}/Cargo.toml"

  spec:
    name: Specification check
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run spec:check
      - name: Verify documents were not rewritten
        run: git diff --exit-code -- spec/docs

  desktop:
    name: Desktop smoke
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run desktop:smoke --report-dir "${{ runner.temp }}/saaa-desktop-smoke"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-smoke-report
          path: ${{ runner.temp }}/saaa-desktop-smoke
          retention-days: 7
          if-no-files-found: warn
