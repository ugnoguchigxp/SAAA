[package]
name = "saaa-reasoning-mcp"
version = "0.1.0"
license = "MIT"
edition = "2021"

[dependencies]
saaa-larm-session = { path = "../../crates/larm-session" }
saaa-reasoning-contract = { path = "../../crates/reasoning-contract" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
url = "2"
futures-util = "0.3"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
