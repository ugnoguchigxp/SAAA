[package]
name = "saaa"
version = "0.1.0"
description = "Situation-Aware Ambient Agent Runtime"
authors = ["SAAA contributors"]
license = "MIT"
edition = "2021"
default-run = "saaa"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "saaa_lib"
# SAAA currently ships as a desktop application. The binary links this crate as
# an rlib; staticlib/cdylib are mobile embedding artifacts and duplicated the
# complete backend in every local build.
crate-type = ["rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
quality-eval-harness = []
provider-diagnostics = []

[[bin]]
name = "harness_llm_diagnostic"
path = "src/bin/harness_llm_diagnostic.rs"
required-features = ["provider-diagnostics"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
saaa-personal-state-core = { path = "../crates/personal-state-core" }
saaa-larm-session = { path = "../crates/larm-session" }
saaa-reasoning-mcp = { path = "../services/reasoning-mcp" }
axum = "0.8"
saaa-reasoning-contract = { path = "../crates/reasoning-contract" }
async-trait = "0.1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
webp = "0.3"
tauri = { version = "2", features = ["unstable"] }
# Reproducible WebView worker and bounded plain-text guard implementation.
tauri-plugin-llm-fetch = { git = "https://github.com/ugnoguchigxp/LLM-fetch.git", rev = "64afbce5e99d24475fd25fceb9bd187a9777599b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
futures-util = "0.3"
fs2 = "0.4"
iana-time-zone = "0.1"
if-addrs = "0.14"
jsonschema = { version = "0.56", default-features = false }
libloading = "0.8"
libc = "0.2"
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "gzip", "brotli", "deflate"] }
scraper = "0.25"
ipnet = "2"
encoding_rs = "0.8"
rodio = { version = "0.20.1", default-features = false }
regex = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEventSource", "CGEventTypes"] }

[dev-dependencies]
time = { version = "0.3.55", features = ["formatting"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# Full DWARF data made each local copy of the backend hundreds of megabytes.
# Line tables retain useful source locations and backtraces without duplicating
# all type and variable debug information in dev and test artifacts.
[profile.dev]
debug = 1

[profile.test]
debug = 1

[[bench]]
name = "sqlite_read_path"
harness = false
