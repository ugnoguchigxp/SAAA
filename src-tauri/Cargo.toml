[package]
name = "saaa"
version = "0.1.0"
description = "Situation-Aware Ambient Agent Runtime"
authors = ["SAAA contributors"]
edition = "2021"
default-run = "saaa"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "saaa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
quality-eval-harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-llm-fetch = { git = "https://github.com/ugnoguchigxp/LLM-fetch.git", rev = "76b0fcff8ed7db3a306212aca8c5759b6f814fa6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
futures-util = "0.3"
fs2 = "0.4"
iana-time-zone = "0.1"
libloading = "0.8"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
regex = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEventSource", "CGEventTypes"] }
security-framework = "3.7"

[dev-dependencies]
time = { version = "0.3.55", features = ["formatting"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[[bench]]
name = "streaming_hot_path"
harness = false

[[bench]]
name = "sqlite_read_path"
harness = false
