[package]
name = "saaa-conversation-preview"
version = "0.1.0"
license = "MIT"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
saaa-conversation-core = { path = "../saaa-conversation-core" }
saaa-larm-session = { path = "../larm-session" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
rodio = { version = "0.20.1", default-features = false, features = ["symphonia-aiff", "wav"] }
tempfile = "3"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
