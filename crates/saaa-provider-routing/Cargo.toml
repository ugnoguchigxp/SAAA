[package]
name = "saaa-provider-routing"
version = "0.1.0"
license = "MIT"
edition = "2021"

[dependencies]
saaa-larm-session = { path = "../larm-session" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
